name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p otel-auto-core

  build-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.build --target builder -t otel-auto-build .
      - run: |
          id=$(docker create otel-auto-build)
          docker cp "$id:/tmp/otel_auto.so" otel_auto.so
          docker rm "$id"
          ls -la otel_auto.so
      - uses: actions/upload-artifact@v4
        with:
          name: otel_auto.so
          path: otel_auto.so

  php-integration:
    needs: build-so
    runs-on: ubuntu-latest
    # Match Dockerfile.build (PHP 8.2 NTS) so otel_auto.so loads.
    container: php:8.2-cli-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: otel_auto.so
          path: .
      - name: Install build deps for tiny_http / clap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config
          php -v
          ls -la otel_auto.so
      - run: cargo run -p xtask -- php-integration --so ./otel_auto.so --php php
