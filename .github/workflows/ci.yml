name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p otel-auto-core

  build-so:
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            arch: x86_64
            runs-on: ubuntu-latest
          - php: "8.5"
            arch: x86_64
            runs-on: ubuntu-latest
          - php: "8.2"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - php: "8.5"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Build otel_auto.so (PHP ${{ matrix.php }} / ${{ matrix.arch }})
        run: |
          docker build -f Dockerfile.build --target builder \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            -t otel-auto-build:${{ matrix.php }}-${{ matrix.arch }} .
          id=$(docker create otel-auto-build:${{ matrix.php }}-${{ matrix.arch }})
          docker cp "$id:/tmp/otel_auto.so" "otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}.so"
          docker rm "$id"
          ls -la "otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}.so"
      - uses: actions/upload-artifact@v4
        with:
          name: otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}
          path: otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}.so

  php-integration:
    needs: build-so
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            arch: x86_64
            runs-on: ubuntu-latest
          - php: "8.5"
            arch: x86_64
            runs-on: ubuntu-latest
          - php: "8.2"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - php: "8.5"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    # Match Dockerfile.build PHP so the .so loads (same arch as runner).
    container: php:${{ matrix.php }}-cli-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}
          path: .
      - name: Install build deps for tiny_http / clap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config
          php -v
          uname -m
          ls -la "otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}.so"
      - run: >
          cargo run -p xtask -- php-integration
          --so ./otel_auto-php${{ matrix.php }}-linux-${{ matrix.arch }}.so
          --php php
