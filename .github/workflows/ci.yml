name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p otel-auto-core

  build-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.build --target builder -t otel-auto-build .
      - run: |
          id=$(docker create otel-auto-build)
          docker cp "$id:/tmp/otel_auto.so" otel_auto.so
          docker rm "$id"
          ls -la otel_auto.so
      - uses: actions/upload-artifact@v4
        with:
          name: otel_auto.so
          path: otel_auto.so
