[workspace]
resolver = "2"
members = ["crates/core", "crates/extension", "crates/xtask"]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PHP OTEL Instrumentation contributors"]

[workspace.dependencies]
otel-auto-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = true, features = ["json"] }
thiserror = "2"
rand = "0.8"
hex = "0.4"
