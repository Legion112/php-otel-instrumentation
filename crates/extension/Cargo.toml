[package]
name = "otel_auto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PHP 8.2/8.5 NTS OpenTelemetry auto-instrumentation (linux x86_64/aarch64)"

[lib]
crate-type = ["cdylib"]
name = "otel_auto"

[dependencies]
otel-auto-core = { workspace = true }
ext-php-rs = { version = "0.15", features = ["observer"] }
