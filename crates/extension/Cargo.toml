[package]
name = "alanbase_otel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PHP 8.2 auto-instrumentation extension (OpenTelemetry) for Alanbase"

[lib]
crate-type = ["cdylib"]
name = "alanbase_otel"

[dependencies]
alanbase-otel-core = { workspace = true }
ext-php-rs = { version = "0.15", features = ["observer"] }
